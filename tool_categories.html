<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أقسام التطبيق | مساندة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Almarai:wght@400;700;800&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E1B3A; --primary:#4A3E9E; --primary-dark:#332B72;
    --sand:#FAF8F4; --card:#FFFFFF; --line:#E8E3F5; --muted:#6B6684;
    --gold:#E3A94E; --gold-tint:#FBF0DC;
    --coral:#E2604F; --coral-tint:#FBE7E4;
    --sage:#3F9174; --sage-tint:#E3F3EC;
    --sky:#3E7EA6; --sky-tint:#E3EFF5;
    --plum:#8B5FA8; --plum-tint:#F1E7F6;
    --shadow:0 10px 24px rgba(30,27,58,0.08);
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{font-family:'Almarai',Tahoma,Arial,sans-serif;background:var(--sand);color:var(--ink);}
  .app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--sand);display:flex;flex-direction:column;}

  header{background:var(--primary);color:#fff;height:60px;display:grid;grid-template-columns:44px 1fr 44px;
    align-items:center;padding:0 8px;position:sticky;top:0;z-index:10;}
  .header-title{font-family:'Cairo',sans-serif;font-weight:700;font-size:17px;text-align:center;}
  .icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.14);border:none;color:#fff;cursor:pointer;}
  .icon-btn svg{width:19px;height:19px;}
  .brand-badge{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;}
  .brand-badge svg{width:19px;height:19px;color:var(--primary);}

  .main{flex:1;padding:22px 20px 40px;}
  .intro{font-size:14.5px;color:var(--muted);line-height:1.9;margin:0 0 4px;}
  .intro-title{font-family:'Cairo',sans-serif;font-weight:800;font-size:22px;margin:2px 0 6px;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px;}
  .cat-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 12px 18px;
    text-align:center;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .15s ease;}
  .cat-card:active{transform:scale(0.97);}
  .cat-icon{width:58px;height:58px;border-radius:17px;display:flex;align-items:center;justify-content:center;}
  .cat-icon svg{width:30px;height:30px;}
  .cat-label{font-weight:800;font-size:14.5px;line-height:1.5;font-family:'Cairo',sans-serif;}
  .cat-count{font-size:11.5px;color:var(--muted);font-weight:700;}

  .icon-sage{background:var(--sage-tint);color:var(--sage);}
  .icon-gold{background:var(--gold-tint);color:#B57C1E;}
  .icon-sky{background:var(--sky-tint);color:var(--sky);}
  .icon-primary{background:#EDEAFB;color:var(--primary);}
  .icon-coral{background:var(--coral-tint);color:var(--coral);}
  .icon-plum{background:var(--plum-tint);color:var(--plum);}

  .footer-nav{padding:8px 20px 30px;text-align:center;}
  .btn-ghost{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1.5px solid var(--line);
    color:var(--primary);padding:12px 34px;border-radius:12px;font-weight:700;font-size:14.5px;
    cursor:pointer;font-family:'Cairo',sans-serif;}
</style>
</head>
<body>
<div class="app">
<header>
  <button class="icon-btn" onclick="location.href='index.html'" aria-label="رجوع">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9,4 17,12 9,20" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <span class="header-title">أقسام التطبيق</span>
  <span class="brand-badge">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor">
      <path d="M8 30 C4 26 4 18 10 14" stroke-width="4" stroke-linecap="round"/>
      <path d="M40 30 C44 26 44 18 38 14" stroke-width="4" stroke-linecap="round"/>
      <path d="M24 34 C24 34 12 26 12 17.5 C12 12.8 15.8 9.5 20 9.5 C21.8 9.5 23.4 10.5 24 12 C24.6 10.5 26.2 9.5 28 9.5 C32.2 9.5 36 12.8 36 17.5 C36 26 24 34 24 34 Z" fill="currentColor" stroke="none"/>
    </svg>
  </span>
</header>

<div class="main">
  <p class="intro-title">اختر القسم</p>
  <p class="intro">اختر القسم المناسب لتصل إلى المعلومات والأدوات التي تحتاجها في دعم طلبتك</p>

  <div class="grid">
    <a class="card cat-card" href="psychosocial_needs.html">
      <span class="cat-icon icon-gold">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor">
          <circle cx="18" cy="16" r="7" stroke-width="2.4"/>
          <path d="M6 39c0-9 5.4-14 12-14s12 5 12 14" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="34" cy="13" r="5.5" stroke-width="2.1"/>
          <path d="M27 39c.5-7 3.8-11.5 7-11.5" stroke-width="2.1" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="cat-label">الاحتياجات النفسية/ الاجتماعية</span>
      <span class="cat-count">٣ أدوات</span>
    </a>

    <a class="card cat-card" href="learning_needs.html">
      <span class="cat-icon icon-primary">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor">
          <path d="M24 14c-3.5-3-9-4-16-3v22c7-1 12.5 0 16 3c3.5-3 9-4 16-3V11c-7-1-12.5 0-16 3Z" stroke-width="2.3" stroke-linejoin="round"/>
          <path d="M24 14v22" stroke-width="2"/>
        </svg>
      </span>
      <span class="cat-label">الاحتياجات التعلمية</span>
      <span class="cat-count">٥ أدوات</span>
    </a>

    <a class="card cat-card" href="health_needs.html">
      <span class="cat-icon icon-sage">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor">
          <path d="M24 38 C24 38 8 27 8 16.5 C8 11 12.5 7 18 7 C20.5 7 22.8 8.3 24 10.5 C25.2 8.3 27.5 7 30 7 C35.5 7 40 11 40 16.5 C40 27 24 38 24 38 Z" stroke-width="2.4"/>
          <path d="M13 20 h6 l3 -7 l4 12 l3 -8 l2 3 h6" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="cat-label">الاحتياجات الصحية</span>
      <span class="cat-count">٢ أداة</span>
    </a>

    <a class="card cat-card" href="disability_needs.html">
      <span class="cat-icon icon-sky">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor">
          <circle cx="17" cy="30" r="9" stroke-width="2.4"/>
          <path d="M17 30V13h6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="23" cy="9" r="3.2" fill="currentColor" stroke="none"/>
          <path d="M17 21h10l8 9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="cat-label">ذوي الإعاقة</span>
      <span class="cat-count">٥ أدوات</span>
    </a>

    <a class="card cat-card" href="emergency_cases.html">
      <span class="cat-icon icon-coral">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor">
          <path d="M24 6l14 5v10c0 10-6 16.5-14 21-8-4.5-14-11-14-21V11l14-5Z" stroke-width="2.3" stroke-linejoin="round"/>
          <path d="M24 17v14M17 24h14" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="cat-label">الحالات الطارئة</span>
    </a>

    <a class="card cat-card" href="student_list.html">
      <span class="cat-icon icon-plum">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor">
          <rect x="10" y="9" width="28" height="32" rx="4" stroke-width="2.3"/>
          <path d="M18 9c0-2.2 1.8-4 4-4h4c2.2 0 4 1.8 4 4" stroke-width="2.3"/>
          <circle cx="24" cy="21" r="4.5" stroke-width="2.1"/>
          <path d="M16 34c0-5 4-8 8-8s8 3 8 8" stroke-width="2.1" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="cat-label">قائمة الطلاب</span>
    </a>
  </div>
</div>

<div class="footer-nav">
  <button class="btn-ghost" onclick="location.href='index.html'">رجوع للرئيسية</button>
</div>
</div>
</body>
</html>
