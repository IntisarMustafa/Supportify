<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قائمة الطلاب | مساندة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E1B3A; --primary:#4A3E9E; --sand:#FAF8F4; --card:#FFFFFF; --line:#E8E3F5; --muted:#6B6684;
    --plum:#8B5FA8; --plum-tint:#F1E7F6;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{font-family:'Almarai',Tahoma,Arial,sans-serif;background:var(--sand);color:var(--ink);}
  .app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--sand);display:flex;flex-direction:column;}

  header{background:var(--primary);color:#fff;height:60px;display:grid;grid-template-columns:44px 1fr 44px;
    align-items:center;padding:0 8px;position:sticky;top:0;z-index:10;}
  .header-title{font-family:'Cairo',sans-serif;font-weight:700;font-size:17px;text-align:center;}
  .icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.14);border:none;color:#fff;cursor:pointer;}
  .icon-btn svg{width:19px;height:19px;}
  .brand-badge{width:34px;height:34px;border-radius:50%;background:var(--plum-tint);display:flex;align-items:center;justify-content:center;}
  .brand-badge svg{width:19px;height:19px;color:var(--plum);}

  .main{flex:1;padding:26px 20px 12px;}
  .page-title{font-family:'Cairo',sans-serif;font-weight:800;font-size:23px;margin:2px 0 22px;text-align:center;}

  .empty-state{background:var(--card);border:1.5px dashed var(--line);border-radius:18px;padding:40px 26px;text-align:center;}
  .empty-icon{width:68px;height:68px;border-radius:20px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:var(--plum-tint);color:var(--plum);}
  .empty-icon svg{width:36px;height:36px;}
  .empty-title{font-family:'Cairo',sans-serif;font-weight:800;font-size:17px;margin-bottom:10px;}
  .empty-text{color:var(--muted);font-size:14.5px;line-height:1.9;}

  .footer-nav{padding:22px 20px 30px;text-align:center;}
  .btn-ghost{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1.5px solid var(--line);
    color:var(--primary);padding:12px 34px;border-radius:12px;font-weight:700;font-size:14.5px;
    cursor:pointer;font-family:'Cairo',sans-serif;}
</style>
</head>
<body>
<div class="app">
<header>
  <button class="icon-btn" onclick="location.href='tool_categories.html'" aria-label="رجوع">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9,4 17,12 9,20" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <span class="header-title">قائمة الطلاب</span>
  <span class="brand-badge">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor">
      <rect x="10" y="9" width="28" height="32" rx="4" stroke-width="2.6"/>
      <circle cx="24" cy="21" r="4.5" stroke-width="2.4"/>
    </svg>
  </span>
</header>

<div class="main">
  <h1 class="page-title">قائمة الطلاب</h1>

  <div class="empty-state">
    <div class="empty-icon">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor">
        <rect x="10" y="9" width="28" height="32" rx="4" stroke-width="2.3"/>
        <path d="M18 9c0-2.2 1.8-4 4-4h4c2.2 0 4 1.8 4 4" stroke-width="2.3"/>
        <circle cx="24" cy="21" r="4.5" stroke-width="2.1"/>
        <path d="M16 34c0-5 4-8 8-8s8 3 8 8" stroke-width="2.1" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="empty-title">قيد الإعداد</p>
    <p class="empty-text">سيتم قريبًا إضافة بيانات الطلبة وملفاتهم الفردية هنا لتسهيل متابعة احتياجاتهم</p>
  </div>
</div>

<div class="footer-nav">
  <button class="btn-ghost" onclick="location.href='tool_categories.html'">رجوع</button>
</div>
</div>
</body>
</html>
