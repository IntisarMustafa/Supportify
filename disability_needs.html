<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الطلبة ذوو الإعاقة | مساندة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E1B3A; --primary:#4A3E9E; --sand:#FAF8F4; --card:#FFFFFF; --line:#E8E3F5; --muted:#6B6684;
    --sky:#3E7EA6; --sky-tint:#E3EFF5; --shadow:0 8px 20px rgba(30,27,58,0.07);
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{font-family:'Almarai',Tahoma,Arial,sans-serif;background:var(--sand);color:var(--ink);}
  .app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--sand);display:flex;flex-direction:column;}

  header{background:var(--primary);color:#fff;height:60px;display:grid;grid-template-columns:44px 1fr 44px;
    align-items:center;padding:0 8px;position:sticky;top:0;z-index:10;}
  .header-title{font-family:'Cairo',sans-serif;font-weight:700;font-size:16px;text-align:center;}
  .icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.14);border:none;color:#fff;cursor:pointer;}
  .icon-btn svg{width:19px;height:19px;}
  .brand-badge{width:34px;height:34px;border-radius:50%;background:var(--sky-tint);display:flex;align-items:center;justify-content:center;}
  .brand-badge svg{width:19px;height:19px;color:var(--sky);}

  .main{flex:1;padding:22px 20px 12px;}
  .page-title{font-family:'Cairo',sans-serif;font-weight:800;font-size:22px;margin:2px 0 6px;}
  .page-intro{font-size:14.5px;color:var(--muted);line-height:1.9;margin:0;}

  .item-list{display:flex;flex-direction:column;gap:12px;margin-top:22px;}
  .item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:15px 16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);}
  .item:active{transform:scale(0.98);}
  .item-icon{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--sky-tint);color:var(--sky);}
  .item-icon svg{width:23px;height:23px;}
  .item-text{flex:1;font-weight:700;font-size:15.5px;line-height:1.5;font-family:'Cairo',sans-serif;}
  .item-chevron{width:18px;height:18px;color:var(--muted);flex:none;}

  .footer-nav{padding:18px 20px 30px;text-align:center;}
  .btn-ghost{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1.5px solid var(--line);
    color:var(--primary);padding:12px 34px;border-radius:12px;font-weight:700;font-size:14.5px;
    cursor:pointer;font-family:'Cairo',sans-serif;}
</style>
</head>
<body>
<div class="app">
<header>
  <button class="icon-btn" onclick="location.href='tool_categories.html'" aria-label="رجوع">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9,4 17,12 9,20" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <span class="header-title">الطلبة ذوو الإعاقة</span>
  <span class="brand-badge">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor">
      <circle cx="24" cy="10" r="5" stroke-width="2.6"/>
      <path d="M24 17v13M24 30c-4 4-6 6-6 10M24 30c4 4 6 6 6 10M12 22c5 3 19 3 24 0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
</header>

<div class="main">
  <h1 class="page-title">الطلبة ذوو الإعاقة</h1>
  <p class="page-intro">أدوات وإرشادات عملية لدعم الطلبة ذوي الإعاقة والاستجابة لاحتياجاتهم داخل الصف</p>

  <div class="item-list">
    <a class="item" href="tool15.html">
      <span class="item-icon">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor">
          <path d="M6 24c4-8 11-13 18-13s14 5 18 13c-4 8-11 13-18 13S10 32 6 24Z" stroke-width="2.2" stroke-linejoin="round"/>
          <circle cx="24" cy="24" r="5.5" stroke-width="2.2"/>
          <path d="M8 8l32 32" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="item-text">الضعف البصري</span>
      <svg class="item-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15,4 7,12 15,20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>

    <a class="item" href="tool16.html">
      <span class="item-icon">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor">
          <path d="M22 8c-8 0-13 6-13 13 0 5 3 6 3 11a5 5 0 005 5c3 0 4-2 4-5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 8c8 0 13 6 13 13 0 4-2 6-2 9" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="22" cy="22" r="4" stroke-width="2"/>
          <path d="M8 6l32 36" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="item-text">الضعف السمعي</span>
      <svg class="item-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15,4 7,12 15,20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>

    <a class="item" href="tool17.html">
      <span class="item-icon">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor">
          <circle cx="15" cy="30" r="9" stroke-width="2.2"/>
          <path d="M15 30V13h6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M15 21h10l8 9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="33" cy="30" r="3" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="item-text">الضعف الجسدي</span>
      <svg class="item-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15,4 7,12 15,20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>

    <a class="item" href="tool18.html">
      <span class="item-icon">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor">
          <path d="M20 8c-6 0-10 4-10 9 0 2 .6 3.4 1.6 4.6C10.6 22.6 9 24.6 9 27.5 9 31.6 12.4 35 16.5 35c.9 0 1.7-.2 2.5-.5.8 2.6 3.2 4.5 6 4.5 3.5 0 6.3-2.8 6.5-6.2 3.9-.4 7-3.8 7-7.8 0-2.8-1.5-5.2-3.7-6.6.4-.9.7-1.9.7-3 0-4-3.4-7.4-7.5-7.4-1 0-1.9.2-2.8.5C24 6.9 22.1 5.5 20 8Z" stroke-width="2" stroke-linejoin="round"/>
          <path d="M20 12v16M20 20h6" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="item-text">الصعوبات الذهنية</span>
      <svg class="item-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15,4 7,12 15,20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>

    <a class="item" href="tool19.html">
      <span class="item-icon">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor">
          <path d="M8 12h24a4 4 0 014 4v10a4 4 0 01-4 4H20l-7 6v-6h-5a4 4 0 01-4-4V16a4 4 0 014-4Z" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M32 16c3 0 6 2 6 5.5S35 27 32 27" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="item-text">صعوبات التواصل والنطق واللغة</span>
      <svg class="item-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15,4 7,12 15,20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</div>

<div class="footer-nav">
  <button class="btn-ghost" onclick="location.href='tool_categories.html'">رجوع</button>
</div>
</div>
</body>
</html>
