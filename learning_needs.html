<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاحتياجات التعلمية | مساندة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E1B3A; --primary:#4A3E9E; --primary-tint:#EDEAFB; --sand:#FAF8F4; --card:#FFFFFF;
    --line:#E8E3F5; --muted:#6B6684; --shadow:0 8px 20px rgba(30,27,58,0.07);
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{font-family:'Almarai',Tahoma,Arial,sans-serif;background:var(--sand);color:var(--ink);}
  .app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--sand);display:flex;flex-direction:column;}

  header{background:var(--primary);color:#fff;height:60px;display:grid;grid-template-columns:44px 1fr 44px;
    align-items:center;padding:0 8px;position:sticky;top:0;z-index:10;}
  .header-title{font-family:'Cairo',sans-serif;font-weight:700;font-size:17px;text-align:center;}
  .icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.14);border:none;color:#fff;cursor:pointer;}
  .icon-btn svg{width:19px;height:19px;}
  .brand-badge{width:34px;height:34px;border-radius:50%;background:var(--primary-tint);display:flex;align-items:center;justify-content:center;}
  .brand-badge svg{width:19px;height:19px;color:var(--primary);}

  .main{flex:1;padding:22px 20px 12px;}
  .page-title{font-family:'Cairo',sans-serif;font-weight:800;font-size:23px;margin:2px 0 6px;}
  .page-intro{font-size:14.5px;color:var(--muted);line-height:1.9;margin:0;}

  .item-list{display:flex;flex-direction:column;gap:12px;margin-top:22px;}
  .item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:15px 16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);}
  .item:active{transform:scale(0.98);}
  .item-icon{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--primary-tint);color:var(--primary);}
  .item-icon svg{width:23px;height:23px;}
  .item-text{flex:1;font-weight:700;font-size:15.5px;line-height:1.5;font-family:'Cairo',sans-serif;}
  .item-chevron{width:18px;height:18px;color:var(--muted);flex:none;}

  .footer-nav{padding:18px 20px 30px;text-align:center;}
  .btn-ghost{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1.5px solid var(--line);
    color:var(--primary);padding:12px 34px;border-radius:12px;font-weight:700;font-size:14.5px;
    cursor:pointer;font-family:'Cairo',sans-serif;}
</style>
</head>
<body>
<div class="app">
<header>
  <button class="icon-btn" onclick="location.href='tool_categories.html'" aria-label="رجوع">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9,4 17,12 9,20" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <span class="header-title">الاحتياجات التعلمية</span>
  <span class="brand-badge">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor">
      <path d="M24 14c-3.5-3-9-4-16-3v22c7-1 12.5 0 16 3c3.5-3 9-4 16-3V11c-7-1-12.5 0-16 3Z" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M24 14v22" stroke-width="2.2"/>
    </svg>
  </span>
</header>

<div class="main">
  <h1 class="page-title">الاحتياجات التعلمية</h1>
  <p class="page-intro">استراتيجيات وأدوات عملية لدعم الطلبة في مهارات التعلم المختلفة، من الاستعداد المبكر إلى التميز</p>

  <div class="item-list">
    <a class="item" href="tool8.html">
      <span class="item-icon">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor">
          <path d="M24 8l14 8v16l-14 8-14-8V16l14-8Z" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M24 24l14-8M24 24v16M24 24L10 16" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="item-text">مهارات ما قبل التعلم</span>
      <svg class="item-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15,4 7,12 15,20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>

    <a class="item" href="tool9.html">
      <span class="item-icon">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor">
          <path d="M10 12h22a4 4 0 014 4v20H14a4 4 0 01-4-4V12Z" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M16 20h14M16 26h14" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="item-text">صعوبات القراءة</span>
      <svg class="item-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15,4 7,12 15,20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>

    <a class="item" href="tool10.html">
      <span class="item-icon">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor">
          <path d="M30 8l10 10L18 40H8V30L30 8Z" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M25 13l10 10" stroke-width="2"/>
        </svg>
      </span>
      <span class="item-text">صعوبات الكتابة</span>
      <svg class="item-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15,4 7,12 15,20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>

    <a class="item" href="tool11.html">
      <span class="item-icon">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor">
          <rect x="9" y="9" width="30" height="30" rx="5" stroke-width="2.2"/>
          <path d="M16 19h4M22 19h10M16 25h16M16 31h10" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="item-text">صعوبات الرياضيات</span>
      <svg class="item-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15,4 7,12 15,20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>

    <a class="item" href="tool12.html">
      <span class="item-icon">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor">
          <path d="M24 6l4.5 9.5L38 17l-7 7 1.7 9.8L24 29l-8.7 4.8L17 24l-7-7 9.5-1.5L24 6Z" stroke-width="2.1" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="item-text">الطلبة الموهوبون والمتميزون</span>
      <svg class="item-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15,4 7,12 15,20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</div>

<div class="footer-nav">
  <button class="btn-ghost" onclick="location.href='tool_categories.html'">رجوع</button>
</div>
</div>
</body>
</html>
